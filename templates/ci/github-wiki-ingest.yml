name: Wiki ingest

# Once a day: adds new repos of the owners in home.yaml, regenerates now.md and branches.md,
# then Claude ingests the work merged since the last run and pushes it.
# Secrets: HOST_READ_TOKEN (a token that can read every repo in repos.yaml; a classic PAT with
# repo + read:org for orgs) and CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.HOST_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare
        run: |
          git config user.name "home bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          bin/home discover
          bin/home now
          bin/home branches 14
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You maintain the wiki of this home repo. Read AGENTS.md, then follow .agents/skills/wiki-ingest/SKILL.md, section "From the host", for the work listed by `bin/home pending`. wiki/now.md and wiki/branches.md are already regenerated. If `bin/home discover` added repos to repos.yaml (purpose starts with "NEW"), describe them from their README and run `bin/home pointers`. Write only under wiki/ and raw/ and to repos.yaml, never secrets or personal data. When done run `bin/home pending --done`, `bin/home log ingest "<summary>"`, `bin/home index`, `bin/home check` (fix what it reports), then `bin/home save "wiki: daily ingest"`; if it reports a CONFLICT, merge as wiki-ingest > Conflicts says and run `bin/home save --continue`.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(bin/home:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*)"
      - name: Push what is left
        run: |
          bin/home save "wiki: daily ingest $(date -u +%F)"
